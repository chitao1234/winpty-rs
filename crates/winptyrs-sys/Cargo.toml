[package]
name = "winptyrs-sys"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/andfoy/winpty-rs"
repository = "https://github.com/andfoy/winpty-rs"
description = "Raw FFI bindings and native linking for winpty"
readme = "README.md"
links = "winpty"
keywords = ["windows", "pty", "winpty", "ffi"]
categories = ["external-ffi-bindings", "os::windows-apis"]
build = "build.rs"
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "src/**",
    "vendor/winpty/**",
    "!vendor/winpty/.git",
]

[features]
default = []
vendored = []

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
which = "8.0.0"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-gnu"
targets = ["x86_64-pc-windows-gnu"]
