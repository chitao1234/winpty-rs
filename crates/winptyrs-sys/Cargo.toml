[package]
name = "winptyrs-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Raw FFI bindings and native linking for winpty"
readme = "README.md"
links = "winpty"
keywords = ["windows", "pty", "winpty", "ffi"]
categories = ["external-ffi-bindings", "os::windows-apis"]
build = "build.rs"
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "src/**",
    "vendor/winpty/**",
]

[features]
default = []
vendored = []

[build-dependencies]
which = "8.0.0"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-gnu"
targets = ["x86_64-pc-windows-gnu"]
