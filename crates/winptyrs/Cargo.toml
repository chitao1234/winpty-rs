[package]
name = "winptyrs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Rust-idiomatic wrapper around winpty"
readme = "README.md"
keywords = ["windows", "pty", "winpty", "pseudoterminal"]

[features]
default = []
vendored = ["winptyrs-sys/vendored"]

[dependencies]
bitflags = "2.3"
crossbeam-channel = "0.5.15"
thiserror = "2.0"
winptyrs-sys = { path = "../winptyrs-sys", version = "0.1.0" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-gnu"
targets = ["x86_64-pc-windows-gnu"]
