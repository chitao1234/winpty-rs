name: Windows release

on:
  release:
    types: [created]

jobs:
  windows:
    name: Release
    runs-on: windows-latest
    permissions:
      id-token: write
    env:
      RUNNER_OS: "windows"
      CI: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          miniforge-version: latest
          activate-environment: test
          python-version: "3.10"
      - name: Install winpty
        shell: bash -l {0}
        run: conda install -y winpty
      - name: Workspace verification
        shell: bash -l {0}
        run: cargo test --workspace --all-targets -- --test-threads=1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish winptyrs-sys
        shell: bash -l {0}
        run: cargo publish -p winptyrs-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index
        shell: bash -l {0}
        run: sleep 30
      - name: Publish winptyrs
        shell: bash -l {0}
        run: cargo publish -p winptyrs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
