name: Windows release

on:
  release:
    types: [created]

jobs:
  windows:
    name: Release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify vendored winpty checkout
        shell: bash
        run: |
          test -f crates/winptyrs-sys/vendor/winpty/VERSION.txt
          test -f crates/winptyrs-sys/vendor/winpty/src/include/winpty.h
      - name: Workspace verification
        shell: bash
        run: cargo test --workspace --all-targets -- --test-threads=1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish winptyrs-sys
        shell: bash
        run: cargo publish -p winptyrs-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Wait for crates.io index
        shell: bash
        run: sleep 30
      - name: Publish winptyrs
        shell: bash
        run: cargo publish -p winptyrs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
